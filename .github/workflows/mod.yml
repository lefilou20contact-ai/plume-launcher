name: mod
on:
  push:
    tags: ['mod-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Version depuis le tag
        run: echo "MOD_VERSION=${GITHUB_REF_NAME#mod-v}" >> "$GITHUB_ENV"
      - name: Compilation
        working-directory: mod
        env:
          PLUME_BACKEND_URL: ${{ secrets.PLUME_BACKEND_URL }}
        run: gradle build -Pmod_version="$MOD_VERSION" --no-daemon
      - name: Somme de contrôle SHA-512
        working-directory: mod/build/libs
        run: |
          JAR=$(ls plume-cosmetics-*+mc*.jar | head -1)
          sha512sum "$JAR" | cut -d' ' -f1 > "$JAR.sha512"
          ls -la
      - name: Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: 'Plume Cosmetics ${{ github.ref_name }}'
          files: |
            mod/build/libs/plume-cosmetics-*+mc*.jar
            mod/build/libs/plume-cosmetics-*+mc*.jar.sha512
      - name: Publication Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' && vars.MODRINTH_ID != '' }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: mod/build/libs/plume-cosmetics-*+mc*.jar
          loaders: |
            fabric
            quilt
          game-versions: 1.21.4
          version-type: release
