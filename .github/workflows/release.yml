name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Dépendances Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Version depuis le tag
        shell: bash
        run: |
          node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f)),v=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(!/^\\d+\\.\\d+\\.\\d+$/.test(v)){console.error('Le tag doit etre de la forme v1.2.3 (trois nombres), recu : '+process.env.GITHUB_REF_NAME);process.exit(1)}c.version=v;fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - run: npm install
      - name: Couverture des traductions
        shell: bash
        run: node scripts/i18n.js status || true

      - name: Génération des icônes Tauri
        run: npx tauri icon app-icon.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PLUME_MS_CLIENT_ID: ${{ secrets.PLUME_MS_CLIENT_ID }}
          PLUME_CURSEFORGE_API_KEY: ${{ secrets.PLUME_CURSEFORGE_API_KEY }}
          PLUME_BACKEND_URL: ${{ secrets.PLUME_BACKEND_URL }}
          PLUME_BACKEND_ANON_KEY: ${{ secrets.PLUME_BACKEND_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Plume ${{ github.ref_name }}'
          releaseBody: 'Version de test du launcher.'
          releaseDraft: false
