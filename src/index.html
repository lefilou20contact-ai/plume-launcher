<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav">
  <div class="brand"><span class="logo"></span>Plume</div>
  <button data-p="home" class="on"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span data-i18n="nav.play"></span></button>
  <button data-p="inst"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span data-i18n="nav.instances"></span></button>
  <button data-p="mods"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span data-i18n="nav.mods"></span></button>
  <button data-p="logs"><svg viewBox="0 0 24 24"><path d="M4 17l6-6-6-6M12 19h8"/></svg><span data-i18n="nav.logs"></span></button>
  <button data-p="lab"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5.5 9.5A2 2 0 0 0 6.2 21h11.6a2 2 0 0 0 1.7-2.5L14 9V3"/><path d="M7.5 15h9"/></svg><span data-i18n="nav.lab"></span></button>
  <button data-p="set"><svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg><span data-i18n="nav.settings"></span></button>
  <div class="sp"></div>
  <button id="donate" class="donate"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-9.3-9C1.4 9 3 5.5 6.3 5.2 8.2 5 9.9 6 12 8.2 14.1 6 15.8 5 17.7 5.2 21 5.5 22.6 9 21.3 12c-2.3 4.6-9.3 9-9.3 9z"/></svg><span data-i18n="nav.donate"></span></button>
  <div id="side-acc"></div>
  <small>Plume <span id="appv"></span></small>
</nav>
<main>
  <div class="banner" id="upd" hidden><span id="updt"></span><button class="btn p sm" id="updgo" data-i18n="upd.install"></button></div>
  <section class="v on" id="p-home"></section>
  <section class="v" id="p-inst"></section>
  <section class="v" id="p-mods"></section>
  <section class="v" id="p-logs"></section>
  <section class="v" id="p-lab"></section>
  <section class="v" id="p-set"></section>
</main>
<div id="toasts" aria-live="polite"></div>
<div class="modal" id="modal"></div>

<div class="ov" id="ovPrep"><h2 id="ptitle"></h2><div class="pbar ind"><u id="pb"></u></div><p id="prog"></p></div>
<div class="ov" id="ovLogin"><h2 data-i18n="login.title"></h2><p id="lhelp"></p><h1 id="lcode"></h1><p id="lerr"></p><button class="btn" id="lclose" data-i18n="c.close"></button></div>
<div class="ov" id="ovCrash"><h2 id="ctitle" class="bad" data-i18n="crash.title"></h2><p id="cmsg"></p><pre id="clog"></pre><div class="row"><button class="btn p" id="again" data-i18n="c.relaunch"></button><button class="btn" id="logs" data-i18n="crash.logs"></button><button class="btn" id="back" data-i18n="c.back"></button></div></div>
<script src="app.js"></script>
</body>
</html>
